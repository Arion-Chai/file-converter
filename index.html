<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文件转换器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='4' width='18' height='16' rx='2' fill='none' stroke='%2338bdf8' stroke-width='2'/%3E%3Cpath d='M8 12h8M8 8h4M8 16h6' stroke='%2338bdf8' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0b0d10;
    --panel:#14171c;
    --panel2:#1a1f26;
    --line:#2a313b;
    --text:#e6eaef;
    --muted:#8b95a3;
    --accent:#38bdf8;
    --accent-dim:rgba(56,189,248,.12);
    --ok:#34d399;
    --warn:#fbbf24;
    --err:#f87171;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  /* 黑白主题：浅底黑字，与深色彩色主题形成明显区分 */
  body.bw{
    --bg:#ffffff;--panel:#ffffff;--panel2:#f2f2f2;--line:#111111;
    --text:#0a0a0a;--muted:#555555;--accent:#000000;
    --accent-dim:rgba(0,0,0,.07);--ok:#0a0a0a;--warn:#0a0a0a;--err:#111111;
    color-scheme:light;
  }
  body.bw .btn{color:#fff}
  body.bw .tgt.sel{color:#fff}
  body{
    background:var(--bg);color:var(--text);
    font-family:-apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    line-height:1.6;min-height:100vh;
  }
  .layout{display:flex;min-height:100vh}
  .main{flex:1;min-width:0}
  .mono{font-family:ui-monospace,Consolas,"Courier New",monospace}
  .wrap{max-width:920px;margin:0 auto;padding:24px 20px 64px}
  /* sidebar */
  .side{
    width:232px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);
    padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;
    display:flex;flex-direction:column;
  }
  .side-bottom{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
  .side-open{width:100%;text-align:left}
  .side-title{font-size:15px;font-weight:650;margin-bottom:18px;color:var(--accent)}
  .side-group{margin-bottom:18px}
  .side-label{font-size:12px;color:var(--muted);margin-bottom:8px}
  .side-opts{display:flex;flex-direction:column;gap:6px}
  .side-btn{
    border:1px solid var(--line);background:var(--panel2);color:var(--text);
    border-radius:6px;padding:8px 10px;font-size:13px;cursor:pointer;text-align:left;
    transition:border-color .12s,background .12s,color .12s;
  }
  .side-btn:hover{border-color:var(--accent)}
  .side-btn.sel{border-color:var(--accent);background:var(--accent-dim);color:var(--accent);font-weight:600}
  header{
    display:flex;align-items:baseline;gap:14px;padding:8px 0 20px;
    border-bottom:1px solid var(--line);margin-bottom:22px;
  }
  header h1{font-size:22px;font-weight:650;letter-spacing:.5px}
  header h1 b{color:var(--accent);font-weight:650}
  header span{color:var(--muted);font-size:13px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:16px}
  .card h2{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:.5px;margin-bottom:12px}
  /* upload */
  .drop{
    border:1.5px dashed var(--line);border-radius:8px;padding:34px 18px;text-align:center;
    cursor:pointer;transition:border-color .15s,background .15s;
  }
  .drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-dim)}
  .drop .big{font-size:16px;font-weight:500;margin-bottom:6px}
  .drop .small{color:var(--muted);font-size:13px}
  .drop input[type=file]{display:none}
  /* file info */
  .info{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:14px}
  .info .kv b{color:var(--muted);font-weight:500;margin-right:6px}
  .info .tag{display:inline-block;padding:2px 9px;border-radius:4px;background:var(--accent-dim);color:var(--accent);font-size:12px}
  /* target groups */
  .groups{display:flex;flex-direction:column;gap:12px;max-height:340px;overflow:auto;padding-right:4px}
  .group .gt{font-size:12px;color:var(--muted);margin-bottom:7px;display:flex;align-items:center;gap:8px}
  .group .gt .how{font-size:11px;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:7px}
  .tgt{
    border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:7px 6px;
    text-align:center;font-size:13px;cursor:pointer;transition:border-color .12s,background .12s,color .12s;
  }
  .tgt .e{display:block;font-family:ui-monospace,Consolas,monospace}
  .tgt:hover{border-color:var(--accent)}
  .tgt.sel{border-color:var(--accent);background:var(--accent-dim);color:#fff}
  .tgt.sel .e{color:var(--accent)}
  /* method + params */
  .method{font-size:14px;color:var(--text);background:var(--panel2);border-left:3px solid var(--accent);padding:11px 14px;border-radius:0 6px 6px 0;line-height:1.7}
  .params{display:flex;flex-wrap:wrap;gap:14px 22px;margin-top:12px}
  .param{display:flex;flex-direction:column;gap:5px;min-width:150px}
  .param label{font-size:12px;color:var(--muted)}
  .param input[type=number]{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:5px;padding:6px 8px;font-size:13px;width:100%}
  .param input[type=range]{width:100%;accent-color:var(--accent)}
  .param .val{font-size:12px;color:var(--accent);text-align:right}
  /* actions */
  .actions{display:flex;align-items:center;gap:14px;margin-top:16px;flex-wrap:wrap}
  .btn{
    border:none;border-radius:6px;padding:11px 22px;font-size:15px;font-weight:600;cursor:pointer;
    background:var(--accent);color:#062033;transition:filter .12s,opacity .12s;
  }
  .btn:hover{filter:brightness(1.08)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .btn.ghost:hover{color:var(--text);border-color:var(--muted)}
  .dl{font-size:13px;color:var(--ok)}
  .note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.7}
  /* toast */
  #toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
    background:var(--panel2);border:1px solid var(--line);color:var(--text);
    padding:11px 20px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;
    transition:opacity .2s,transform .2s;z-index:50;max-width:88vw;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.ok{border-color:var(--ok);color:var(--ok)}
  #toast.err{border-color:var(--err);color:var(--err)}
  #toast.warn{border-color:var(--warn);color:var(--warn)}
  @media(max-width:760px){
    .layout{flex-direction:column}
    .side{width:100%;height:auto;position:static;border-right:none;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 14px}
    .side-title{margin:0}
    .side-group{margin:0;display:flex;align-items:center;gap:8px}
    .side-opts{flex-direction:row;flex-wrap:wrap}
    .side-btn{padding:6px 10px}
  }
  @media(max-width:560px){
    header{flex-direction:column;gap:2px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(74px,1fr))}
    .btn{width:100%}
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="side">
    <div class="side-title" data-i18n="title">文件转换器</div>
    <div class="side-group">
      <div class="side-label" data-i18n="lang">语言</div>
      <div class="side-opts" id="langOpts">
        <button class="side-btn" data-lang="zh">中文</button>
        <button class="side-btn" data-lang="en">English</button>
        <button class="side-btn" data-lang="fr">Français</button>
        <button class="side-btn" data-lang="ru">Русский</button>
        <button class="side-btn" data-lang="es">Español</button>
        <button class="side-btn" data-lang="ar">العربية</button>
      </div>
    </div>
    <div class="side-group">
      <div class="side-label" data-i18n="tone">色调</div>
      <div class="side-opts" id="toneOpts">
        <button class="side-btn" data-tone="color" data-i18n="color">黑色</button>
        <button class="side-btn" data-tone="bw" data-i18n="bw">白色</button>
      </div>
    </div>
    <div class="side-group side-bottom">
      <div class="side-label" data-i18n="tokenLabel">服务器 Token</div>
      <input type="password" class="token-input" id="tokenInput" placeholder="GitHub Token" autocomplete="off" spellcheck="false">
      <button class="side-btn side-open" id="openTableBtn" data-i18n="openTable">查看转换方式</button>
    </div>
  </aside>
  <main class="main">
  <div class="wrap">
  <header>
    <h1 data-i18n="title">文件转换器</h1>
  </header>

  <!-- ===== 上传 ===== -->
  <section class="card">
    <h2 data-i18n="up">① 上传文件</h2>
    <div class="drop" id="drop">
      <div class="big" data-i18n="dropBig">点击或拖拽文件到此处</div>
      <div class="small" data-i18n="dropSmall">支持 .txt .docx .jpg .png .mp4 .zip 等 113 种格式</div>
      <input type="file" id="fileInput">
    </div>
  </section>

  <!-- ===== 源信息 + 目标选择 ===== -->
  <section class="card" id="targetCard" style="display:none">
    <h2 data-i18n="srcSec">② 源文件与目标格式</h2>
    <div class="info" id="fileInfo"></div>
    <div style="margin-top:14px" class="groups" id="groups"></div>
  </section>

  <!-- ===== 转换方式 + 参数 + 执行 ===== -->
  <section class="card" id="actCard" style="display:none">
    <h2 data-i18n="actSec">③ 转换方式与执行</h2>
    <div class="method" id="method"></div>
    <div class="params" id="params"></div>
    <div class="actions">
      <button class="btn" id="convertBtn" data-i18n="convert">转换并下载</button>
      <span class="dl" id="dlMsg"></span>
    </div>
    <div class="note" id="note"></div>
  </section>
  </div>
  </main>
</div>

<div id="toast"></div>

/* ===== 转换方式 ===== */
function methodOf(src, dst){
  const ca=FMT[src], cb=FMT[dst];
  if(PROG.has(src) && PROG.has(dst)) return t('methodProg');
  if(ca===cb) return t('methodDirect');
  const raw=(CROSS[ca]&&CROSS[ca][cb])||RAW_NO;
  return raw===RAW_NO ? t('methodNo') : raw;
}

const drop=$('drop'), fileInput=$('fileInput');

['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev, e=>{e.preventDefault();drop.classList.add('over');}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev, e=>{e.preventDefault();drop.classList.remove('over');}));
drop.addEventListener('drop', e=>{ if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', e=>{ if(e.target.files.length) handleFile(e.target.files[0]); });

function handleFile(file){
  const m = file.name.match(/\.([^.]+)$/);
  const ext = m ? ('.'+m[1].toLowerCase()) : '';
  if(!FMT[ext]){
    toast(t('errUnsup')+(ext||''), 'err');
    return;
  }
  state = {file, srcExt:ext, target:null};
  renderSource();
  renderGroups();
  $('actCard').style.display='none';
  $('targetCard').style.display='';
  $('convertBtn').disabled = true;
  $('dlMsg').textContent='';
}

function renderSource(){
  const e = state.srcExt, cat=FMT[e];
  $('fileInfo').innerHTML =
    '<div class="kv"><b>'+t('fname')+'</b>'+escapeHtml(state.file.name)+'</div>'+
    '<div class="kv"><b>'+t('fmt')+'</b><span class="tag mono">'+e+'</span></div>'+
    '<div class="kv"><b>'+t('ftype')+'</b>'+t('cat_'+cat)+'</div>'+
    '<div class="kv"><b>'+t('size')+'</b>'+fmtSize(state.file.size)+'</div>';
}
function fmtSize(b){
  if(b<1024) return b+' B';
  if(b<1048576) return (b/1024).toFixed(1)+' KB';
  return (b/1048576).toFixed(2)+' MB';
}

/* ===== 目标格式 ===== */
function targetsFor(src){
  const ca=FMT[src], out=[];
  for(const e in FMT){
    if(e===src) continue;
    const cb=FMT[e];
    let ok;
    if(PROG.has(src)&&PROG.has(e)) ok=true;
    else if(ca===cb) ok=true;
    else { const raw=CROSS[ca]&&CROSS[ca][cb]; ok=!!raw && raw!==RAW_NO; }
    if(!ok) continue;
    out.push({e, c:cb, m:methodOf(src,e)});
  }
  out.sort((a,b)=>(a.c===ca?0:1)-(b.c===ca?0:1));
  return out;
}

function renderGroups(){
  const targets = targetsFor(state.srcExt);
  const ca = FMT[state.srcExt];
  const groups = {};
  targets.forEach(t=>{ (groups[t.c]=groups[t.c]||[]).push(t); });
  const order = CATS.slice().sort((a,b)=>(a===ca?-1:0)-(b===ca?-1:0));
  const el = $('groups');
  el.innerHTML='';
  order.forEach(c=>{
    if(!groups[c]) return;
    const box=document.createElement('div'); box.className='group';
    const how = groups[c][0].m;
    box.innerHTML = '<div class="gt"><span>'+(c===ca?(t('same')+' '):'')+t('cat_'+c)+'</span><span class="how mono">'+escapeHtml(how)+'</span></div>';
    const grid=document.createElement('div'); grid.className='grid';
    groups[c].forEach(t=>{
      const b=document.createElement('div'); b.className='tgt mono';
      b.innerHTML='<span class="e">'+t.e+'</span>';
      b.onclick=()=>selectTarget(t, b);
      grid.appendChild(b);
    });
    box.appendChild(grid); el.appendChild(box);
  });
}
function escapeHtml(s){ return s.replace(/[&<>]/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch])); }

/* ===== 选中目标 ===== */
function selectTarget(tgt, node){
  document.querySelectorAll('.tgt.sel').forEach(x=>x.classList.remove('sel'));
  node.classList.add('sel');
  state.target = tgt;
  $('method').textContent = tgt.m + '（'+state.srcExt+' → '+tgt.e+'）';
  renderParams();
  $('actCard').style.display='';
  $('convertBtn').disabled = false;
  $('dlMsg').textContent='';
  $('note').textContent = canReal(tgt) ? '' : t('note');
}

function canReal(tgt){
  const ca=FMT[state.srcExt], cb=tgt.c, s=state.srcExt, d=tgt.e;
  if(ca==='img' && cb==='img' && IMG_MIME[d]) return true;
  if(TEXT.has(s) && TEXT.has(d) && s!==d) return true;
  if(ca==='aud' && d==='.wav' && s!==d) return true;
  if(CONV3D.has(s) && CONV3D.has(d) && s!==d) return true;
  return false;
}

/* ===== 参数（图片转换） ===== */
let paramVals = {w:'', gray:0, bright:1};
function renderParams(){
  const tgt=state.target, ca=FMT[state.srcExt];
  const box=$('params');
  if(ca==='img' && tgt.c==='img' && IMG_MIME[tgt.e]){
    box.innerHTML =
      '<div class="param"><label>'+t('widthPx')+'</label><input type="number" id="pW" min="1" placeholder="'+escapeHtml(t('widthPx'))+'"></div>'+
      '<div class="param"><label>'+t('grayL')+'</label><input type="range" id="pG" min="0" max="100" value="0"><span class="val" id="pGV">0%</span></div>'+
      '<div class="param"><label>'+t('brightL')+'</label><input type="range" id="pB" min="50" max="200" value="100"><span class="val" id="pBV">×1.0</span></div>';
    const g=$('pG'), b=$('pB');
    g.oninput=()=>{$('pGV').textContent=g.value+'%';};
    b.oninput=()=>{$('pBV').textContent='×'+(b.value/100).toFixed(1);};
    $('pW').value = paramVals.w;
  } else {
    box.innerHTML='';
  }
}

/* ===== 转换 ===== */
$('convertBtn').addEventListener('click', async ()=>{
  const btn=$('convertBtn'), tgt=state.target, dl=$('dlMsg');
  if(!tgt) return;
  btn.disabled=true; dl.textContent=t('converting');
  try{
    const name = await doConvert(tgt);
    dl.textContent=t('donePrefix')+name;
    toast(t('toastOk'),'ok');
  }catch(err){
    dl.textContent='';
    toast(err.message||t('toastFail'),'err');
  }finally{
    btn.disabled=false;
  }
});

function doConvert(tgt){
  const ca=FMT[state.srcExt], cb=tgt.c, s=state.srcExt, d=tgt.e;
  if(ca==='img' && cb==='img' && IMG_MIME[d]) return convertImage(tgt);
  if(TEXT.has(s) && TEXT.has(d) && s!==d){
    if(DOC_TEXT.has(s) && DOC_TEXT.has(d)) return convertDocText(tgt);
    if(DATA_TEXT.has(s) && DATA_TEXT.has(d)) return convertDataText(tgt);
    return convertRename(tgt);
  }
  if(ca==='aud' && d==='.wav' && s!==d) return convertAudioWav(tgt);
  if(CONV3D.has(s) && CONV3D.has(d) && s!==d) return convert3D(tgt);
  return convertRemote(tgt);
}

/* ===== GitHub Actions 后端转换（需服务端） ===== */
const GH_REPO='Arion-Chai/file-converter';
const sleep=ms=>new Promise(res=>setTimeout(res,ms));
function ghBase64(buf){ let s=''; const u=new Uint8Array(buf); for(let i=0;i<u.length;i++) s+=String.fromCharCode(u[i]); return btoa(s); }
async function ghPut(path, contentB64, token){
  const r=await fetch('https://api.github.com/repos/'+GH_REPO+'/contents/'+path,{
    method:'PUT',
    headers:{'Authorization':'token '+token,'Content-Type':'application/json'},
    body:JSON.stringify({message:'convert '+path, content:contentB64, branch:'main'})
  });

function convertDocText(tgt){

    };
    fr.onerror=()=>rej(new Error(t('readFail')));

  });

function docConvert(src, s, d){
  if(d==='.html'||d==='.htm'){
    if(s==='.html'||s==='.htm') return src;
    if(s==='.md') return wrapHtml(mdToHtml(src));
    return wrapHtml(txtToHtml(src));
  }
  if(d==='.md'){
    if(s==='.md') return src;
    if(s==='.html'||s==='.htm') return htmlToMd(src);
    return src; /* txt→md：以 Markdown 纯文本形式 */
  }
  /* d==='.txt' */
  if(s==='.txt') return src;
  if(s==='.md') return mdToTxt(src);
  return htmlToTxt(src);
}
function wrapHtml(body){
  return '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<title>文档</title>\n</head>\n<body>\n'+body+'\n</body>\n</html>';
}
function txtToHtml(t){
  return t.split(/\n\s*\n/).map(p=>'<p>'+escapeHtml(p.trim())+'</p>').join('\n');
}
function mdToHtml(t){
  return t.split('\n').map(l=>{
    const m=l.match(/^(#{1,6})\s+(.*)/);
    if(m) return '<h'+m[1].length+'>'+m[2]+'</h'+m[1].length+'>';
    if(/^[-*]\s+/.test(l)) return '<li>'+l.replace(/^[-*]\s+/,'')+'</li>';
    if(l.trim()==='') return '';
    return '<p>'+l+'</p>';
  }).join('\n');
}
function mdToTxt(t){ return t.replace(/^(#{1,6})\s+/gm,'').replace(/^[-*]\s+/gm,'').replace(/[*_]/g,''); }
function htmlToTxt(t){ return t.replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'"); }
function htmlToMd(t){
  let out=htmlToTxt(t).split('\n').map(l=>l.trim()).filter(Boolean).join('\n');
  return out;
}

/* ===== 数据文本互转（csv/json/xml/sql） ===== */
function convertDataText(tgt){

      try{
        const rows=parseData(fr.result, state.srcExt);
        const out=emitData(rows, tgt.e);
        const fname=baseName(state.file.name)+tgt.e;
        download(new Blob([out],{type:'text/plain;charset=utf-8'}), fname);

    };
    fr.onerror=()=>rej(new Error(t('readFail')));
    fr.readAsText(state.file);
  });
}
function parseCsv(t){
  const lines=t.replace(/\r/g,'').split('\n').filter(l=>l.trim()!=='');
  const rows=[]; let row=[], cur='', inQ=false;
  for(const line of lines){
    if(!inQ && rows.length===0 && row.length===0){ }
    let i=0;
    while(i<line.length){
      const ch=line[i];
      if(inQ){
        if(ch==='"' && line[i+1]==='"'){ cur+='"'; i+=2; continue; }
        if(ch==='"'){ inQ=false; i++; continue; }
        cur+=ch; i++;
      }else{
        if(ch==='"'){ inQ=true; i++; }
        else if(ch===','){ row.push(cur); cur=''; i++; }
        else if(ch==='\n'){ row.push(cur); cur=''; rows.push(row); row=[]; i++; }
        else { cur+=ch; i++; }
      }
    }
    row.push(cur); cur=''; rows.push(row); row=[];
  }
  return rows;
}
function parseData(text, s){
  if(s==='.csv'){ const rows=parseCsv(text); return {cols:rows[0]||[], rows:rows.slice(1)}; }
  if(s==='.json'){
    const data=JSON.parse(text);
    const arr=Array.isArray(data)?data:(data&&typeof data==='object'?Object.entries(data).map(([k,v])=>({key:k,value:v})):[data]);
    const cols=arr.length?Object.keys(arr[0]):[];
    return {cols, rows:arr.map(o=>cols.map(c=>o[c]))};
  }
  if(s==='.xml'){
    const doc=new DOMParser().parseFromString(text,'text/xml');
    const root=doc.documentElement;
    const rowsEls=root.querySelectorAll('row');
    if(rowsEls.length){ const cols=[...rowsEls[0].children].map(c=>c.tagName); return {cols, rows:[...rowsEls].map(r=>[...r.children].map(c=>c.textContent))}; }
    const items=[...root.children].filter(e=>e.children.length>0);
    const cols=items.length?[...items[0].children].map(c=>c.tagName):[];
    return {cols, rows:items.map(it=>[...it.children].map(c=>c.textContent))};
  }
  if(s==='.sql'){
    const cols=[...text.matchAll(/CREATE TABLE[^\(]*\(([^)]*)\)/gi)].flatMap(m=>m[1].split(',').map(c=>c.trim().split(/\s+/)[0].replace(/`|"|'/g,'')).filter(Boolean));
    const rows=[];
    for(const m of text.matchAll(/INSERT\s+INTO\s+[\w."`]+\s*(?:\(([^)]*)\))?\s*VALUES\s*(\([^;]*\))/gi)){
      const vals=[...m[2].replace(/^\(|\)$/g,'').matchAll(/(?:'([^']*)'|"([^"]*)"|([^,()]+))/g)].map(x=>(x[1]!==undefined?x[1]:x[2]!==undefined?x[2]:x[3].trim()));
      rows.push(vals);
    }
    return {cols, rows};
  }
  throw new Error('不支持解析：'+s);
}
function escSql(v){ return "'"+String(v).replace(/'/g,"''")+"'"; }
function emitData(r, d){
  const {cols, rows}=r;
  if(d==='.csv'){ return [cols.join(','), ...rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(','))].join('\n'); }
  if(d==='.json'){ return JSON.stringify(rows.map(row=>{const o={};cols.forEach((c,i)=>o[c]=row[i]);return o;}),null,2); }
  if(d==='.xml'){ return '<root>\n'+rows.map(row=>'  <row>'+cols.map((c,i)=>'<'+c+'>'+String(row[i]||'').replace(/[<>&]/g,x=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[x]))+'</'+c+'>').join('')+'</row>').join('\n')+'\n</root>'; }
  if(d==='.sql'){
    const table=cols.length?cols[0].replace(/[^a-zA-Z0-9_]/g,'_'):'t';
    const defs=cols.map(c=>'"'+c.replace(/[^a-zA-Z0-9_]/g,'_')+'" TEXT').join(', ');
    const ins=rows.map(row=>'INSERT INTO '+table+' ('+cols.map(c=>'"'+c.replace(/[^a-zA-Z0-9_]/g,'_')+'"').join(', ')+') VALUES ('+row.map(escSql).join(', ')+');').join('\n');
    return 'CREATE TABLE IF NOT EXISTS '+table+' ('+defs+');\n'+ins;
  }
  throw new Error('不支持输出：'+d);
}

/* ===== 音频→WAV（Web Audio 解码 + WAV 编码） ===== */
function convertAudioWav(tgt){
  return new Promise((res,rej)=>{

    fr.onload=()=>{
      const Ctx=window.AudioContext||window.webkitAudioContext;
      if(!Ctx){ rej(new Error('此浏览器不支持音频解码')); return; }
      const ctx=new Ctx();
      ctx.decodeAudioData(fr.result).then(audio=>{
        try{
          const blob=wavEncode(audio);
          const fname=baseName(state.file.name)+'.wav';
          download(blob,fname); res(fname);
        }catch(e){ rej(new Error('音频编码失败：'+e.message)); }
      },()=>{ ctx.close(); rej(new Error('浏览器无法解码该音频（仅支持 WAV/MP3/OGG/AAC/M4A 等）')); });
    };
    fr.onerror=()=>rej(new Error(t('readFail')));
    fr.readAsArrayBuffer(state.file);
  });
}
function wavEncode(audio){
  const numCh=Math.min(2, audio.numberOfChannels);
  const sr=audio.sampleRate, len=audio.length;
  const n=len*numCh;
  const inter=new Float32Array(n);
  for(let c=0;c<numCh;c++){ const data=audio.getChannelData(c); for(let i=0;i<len;i++) inter[i*numCh+c]=data[i]; }
  const buf=new ArrayBuffer(44+n*2);
  const dv=new DataView(buf);
  const put=(s,o)=>{ for(let i=0;i<s.length;i++) dv.setUint8(o+i,s.charCodeAt(i)); };
  put('RIFF',0); dv.setUint32(4,36+n*2,true); put('WAVE',8);
  put('fmt ',12); dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,numCh,true);
  dv.setUint32(24,sr,true); dv.setUint32(28,sr*numCh*2,true); dv.setUint16(32,numCh*2,true); dv.setUint16(34,16,true);
  put('data',36); dv.setUint32(40,n*2,true);
  let off=44;
  for(let i=0;i<n;i++){ let v=Math.max(-1,Math.min(1,inter[i])); dv.setInt16(off, v<0?v*32768:v*32767, true); off+=2; }
  return new Blob([dv],{type:'audio/wav'});
}

/* ===== 3D 网格互转（obj/stl/ply/gltf/dxf） ===== */
function convert3D(tgt){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      try{
        const mesh=parse3D(fr.result, state.srcExt);
        if(!mesh || !mesh.v.length || !mesh.f.length) throw new Error('该模型不含可读网格');
        const out=emit3D(mesh, tgt.e);
        const mime=tgt.e==='.gltf'?'application/json':'text/plain;charset=utf-8';
        const fname=baseName(state.file.name)+tgt.e;
        download(new Blob([out],{type:mime}), fname);
        res(fname);
      }catch(e){ rej(new Error(e.message||t('imgFail'))); }
    };
    fr.onerror=()=>rej(new Error(t('readFail')));
    fr.readAsArrayBuffer(state.file);
  });
}
function parse3D(buf, ext){
  const text=new TextDecoder('utf-8').decode(buf);
  if(ext==='.obj') return parseObj(text);
  if(ext==='.stl') return text.includes('facet normal')?parseStlText(text):parseStlBin(buf);
  if(ext==='.ply'){ if(text.includes('format binary')) throw new Error('二进制 PLY 暂需服务端，请用文本 PLY'); return parsePly(text); }
  if(ext==='.gltf') return parseGltf(text);
  if(ext==='.dxf') return parseDxf(text);
  throw new Error('无法解析：'+ext);
}
function emit3D(m, ext){
  if(ext==='.obj') return emitObj(m);
  if(ext==='.stl') return emitStl(m);
  if(ext==='.ply') return emitPly(m);
  if(ext==='.gltf') return emitGltf(m);
  if(ext==='.dxf') return emitDxf(m);
  throw new Error('无法输出：'+ext);
}
function parseObj(text){
  const v=[], f=[];
  for(const line of text.split(/\r?\n/)){
    const t=line.trim().split(/\s+/); if(!t[0]) continue;
    if(t[0]==='v'&&t.length>=4) v.push([+t[1],+t[2],+t[3]]);
    else if(t[0]==='f'&&t.length>=4){
      const idx=t.slice(1).map(x=>parseInt(x.split('/')[0],10));
      for(let i=1;i<idx.length-1;i++) f.push([idx[0]-1, idx[i]-1, idx[i+1]-1]);
    }
  }
  return {v,f};
}
function parseStlText(text){
  const v=[], f=[], pts=[];
  for(const line of text.split(/\r?\n/)){
    const t=line.trim().split(/\s+/); if(!t[0]) continue;
    if(t[0]==='vertex'&&t.length>=4) pts.push([+t[1],+t[2],+t[3]]);
    else if(t[0]==='endloop'){
      if(pts.length===3){ const b=v.length; v.push(pts[0],pts[1],pts[2]); f.push([b,b+1,b+2]); }
      pts.length=0;
    }
  }
  return {v,f};
}
function parseStlBin(buf){
  const dv=new DataView(buf);
  const n=dv.getUint32(80,true), v=[], f=[]; let off=84;
  for(let i=0;i<n;i++){
    const base=v.length;
    v.push([dv.getFloat32(off+12,true),dv.getFloat32(off+16,true),dv.getFloat32(off+20,true)],
           [dv.getFloat32(off+24,true),dv.getFloat32(off+28,true),dv.getFloat32(off+32,true)],
           [dv.getFloat32(off+36,true),dv.getFloat32(off+40,true),dv.getFloat32(off+44,true)]);
    f.push([base,base+1,base+2]); off+=50;
  }
  return {v,f};
}
function parsePly(text){
  const lines=text.split(/\r?\n/);
  let nv=0, nf=0, body=-1, inHeader=true;
  for(let i=0;i<lines.length;i++){
    const l=lines[i].trim();
    if(inHeader){
      if(l==='end_header'){ inHeader=false; body=i+1; continue; }
      if(l.startsWith('element vertex ')) nv=parseInt(l.split(' ')[2],10);
      if(l.startsWith('element face ')) nf=parseInt(l.split(' ')[2],10);
    }
  }
  if(body<0||nv===0) throw new Error('PLY 表头无效');
  const v=[], f=[]; let i=body;
  for(let k=0;k<nv;k++,i++){ const p=lines[i].trim().split(/\s+/); v.push([+p[0],+p[1],+p[2]]); }
  for(let k=0;k<nf;k++,i++){
    const p=lines[i].trim().split(/\s+/).map(Number);
    for(let j=1;j<p[0]-1;j++) f.push([p[j],p[j+1],p[j+2]]);
  }

}
function parseGltf(text){

    const bin=atob(uri.split(',')[1]);

  }

  for(let i=0;i<posAcc.count;i++){ const b=pOff+i*12; pos.push([dv.getFloat32(b,true),dv.getFloat32(b+4,true),dv.getFloat32(b+8,true)]); }

  if(idxAcc){
    const bvI=j.bufferViews[idxAcc.bufferView];
    const iOff=(bvI.byteOffset||0)+(idxAcc.byteOffset||0);
    const cs=idxAcc.componentType===5123?2:idxAcc.componentType===5121?1:4;
    for(let i=0;i+2<idxAcc.count;i+=3){
      const b=iOff+i*cs;

      const c1=cs===2?dv.getUint16(b+2,true):cs===1?dv.getUint8(b+1):dv.getUint32(b+4,true);
      const c2=cs===2?dv.getUint16(b+4,true):cs===1?dv.getUint8(b+2):dv.getUint32(b+8,true);

}
function parseDxf(text){

    const code=lines[i].trim(), val=lines[i+1].trim();
    if(code==='0'&&val==='3DFACE'){
      const pt=[[NaN,NaN,NaN],[NaN,NaN,NaN],[NaN,NaN,NaN],[NaN,NaN,NaN]];
      i+=2;
      while(i+1<lines.length && lines[i].trim()!=='0'){
        const c=lines[i].trim(), vv=lines[i+1].trim();
        if(c.length===2&&+c[0]>=1&&+c[0]<=3&&+c[1]>=0&&+c[1]<=3){ pt[+c[1]][+c[0]-1]=+vv; }
        i+=2;
      }
      const ok=pt.every(p=>!isNaN(p[0]));
      if(ok){
        const quad=Math.abs(pt[3][0]-pt[0][0])>1e-9||Math.abs(pt[3][1]-pt[0][1])>1e-9||Math.abs(pt[3][2]-pt[0][2])>1e-9;
        if(quad){ const b=v.length; v.push(pt[0],pt[1],pt[2],pt[3]); f.push([b,b+1,b+2],[b,b+2,b+3]); }
        else { const b=v.length; v.push(pt[0],pt[1],pt[2]); f.push([b,b+1,b+2]); }

  }

}
function emitObj(m){
  const out=[];
  for(const p of m.v) out.push('v '+p[0].toFixed(6)+' '+p[1].toFixed(6)+' '+p[2].toFixed(6));
  for(const t of m.f) out.push('f '+(t[0]+1)+' '+(t[1]+1)+' '+(t[2]+1));
  return out.join('\n');
}
function emitStl(m){
  const o=['solid model'];
  for(const t of m.f){
    o.push('  facet normal 0 0 0','    outer loop');
    for(const k of t){ const p=m.v[k]; o.push('      vertex '+p[0].toFixed(6)+' '+p[1].toFixed(6)+' '+p[2].toFixed(6)); }
    o.push('    endloop','  endfacet');
  }
  o.push('endsolid model');
  return o.join('\n');
}
function emitPly(m){
  const o=['ply','format ascii 1.0','element vertex '+m.v.length,'property float x','property float y','property float z','element face '+m.f.length,'property list uchar int vertex_indices','end_header'];
  for(const p of m.v) o.push(p[0].toFixed(6)+' '+p[1].toFixed(6)+' '+p[2].toFixed(6));

}
function emitGltf(m){

  let bin=''; for(let i=0;i<concat.length;i++) bin+=String.fromCharCode(concat[i]);
  let mn=[Infinity,Infinity,Infinity], mx=[-Infinity,-Infinity,-Infinity];
  for(const p of m.v){ mn[0]=Math.min(mn[0],p[0]);mn[1]=Math.min(mn[1],p[1]);mn[2]=Math.min(mn[2],p[2]);mx[0]=Math.max(mx[0],p[0]);mx[1]=Math.max(mx[1],p[1]);mx[2]=Math.max(mx[2],p[2]); }

    accessors:[{bufferView:0, byteOffset:0, componentType:5126, count:m.v.length, type:'VEC3', min:mn, max:mx},{bufferView:1, byteOffset:0, componentType:5125, count:m.f.length*3, type:'SCALAR'}],
    meshes:[{primitives:[{attributes:{POSITION:0}, indices:1, mode:4}]}], nodes:[{mesh:0}], scenes:[{nodes:[0]}], scene:0 };

}
function emitDxf(m){
  const o=['0','SECTION','2','ENTITIES'];
  for(const t of m.f){
    o.push('0','3DFACE');
    const p=[m.v[t[0]],m.v[t[1]],m.v[t[2]],m.v[t[0]]];
    for(let k=0;k<4;k++){ o.push('1'+k, p[k][0].toFixed(6), '2'+k, p[k][1].toFixed(6), '3'+k, p[k][2].toFixed(6)); }
  }
  o.push('0','ENDSEC','0','EOF');
  return o.join('\n');
}

function convertImage(tgt){
  return new Promise((res,rej)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        try{
          const wIn=$('pW');
          let targetW = wIn && wIn.value ? parseInt(wIn.value,10) : 0;
          let scale = targetW>0 ? targetW/img.naturalWidth : 1;
          const W=Math.max(1, Math.round(img.naturalWidth*scale));
          const H=Math.max(1, Math.round(img.naturalHeight*scale));
          const canvas=document.createElement('canvas');
          canvas.width=W; canvas.height=H;
          const ctx=canvas.getContext('2d');
          const g = paramVals.gray = parseInt($('pG')?$('pG').value:0,10);
          const br = paramVals.bright = parseInt($('pB')?$('pB').value:100,10)/100;
          ctx.filter='grayscale('+g+'%) brightness('+br+')';
          ctx.drawImage(img,0,0,W,H);
          canvas.toBlob(blob=>{
            if(!blob){ rej(new Error(t('imgExportFail')+tgt.e)); return; }
            const fname=baseName(state.file.name)+tgt.e;
            download(blob,fname); res(fname);
          }, IMG_MIME[tgt.e], 0.92);
        }catch(e){ rej(new Error(t('imgFail')+e.message)); }
      };
      img.onerror=()=>rej(new Error(t('imgReadFail')));
      img.src=reader.result;
    };
    reader.onerror=()=>rej(new Error(t('readFail')));
    reader.readAsDataURL(state.file);
  });
}

function download(blob, filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url); a.remove();},1000);
}
